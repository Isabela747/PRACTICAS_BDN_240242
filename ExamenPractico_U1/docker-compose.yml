version: '3.8'

services:
  postgres_mago:
    image: postgres:15-alpine
    container_name: postgres_mago
    restart: always
    environment:
      POSTGRES_USER: mago
      POSTGRES_PASSWORD: "240242"
      POSTGRES_DB: db_240242
    ports:
      - "40242:5432"
    volumes:
      - postgres_data_mago:/var/lib/postgresql/data

  mysql_mago:
    image: mysql:8.0
    container_name: mysql_mago
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "240242"
      MYSQL_DATABASE: db_40243
      MYSQL_USER: mago
      MYSQL_PASSWORD: "240242"
    ports:
      - "40243:3306"
    volumes:
      - mysql_data_mago:/var/lib/mysql

  pgadmin_mago:
    image: dpage/pgadmin4:7.8
    container_name: pgadmin_mago
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: mago@proyectos-integradores-7b-itiid.tech
      PGADMIN_DEFAULT_PASSWORD: "240242"
      PGADMIN_CONFIG_SERVER_MODE: "True"
    ports:
      - "40241:80"
    depends_on:
      - postgres_mago

volumes:
  postgres_data_mago:
  mysql_data_mago: